  /registry/routes/config/get:
    post:
      tags:
        - routes
      summary: get the devices router config
      operationId: routerConfig
      responses:
        '200':
          description: "get the success router config"
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        rid:
                          type: integer
                          example: 1
                        details:
                          type: object
                          properties:
                            rname:
                              type: string
                              example: cwd
                            notifier:
                              type: string
                              example: mqtt
                            mfid:
                              type: integer
                              example: 1

                            config:
                              type: object
                              properties:

                                protocol:
                                  type: string
                                  example: mqtts
                                spayload:
                                  type: object
                                  properties:
                                    reqRefNo:
                                      type: string
                                      example: "nfjdshf26"
                                    statCode:
                                      type: string
                                      example: "S"
                                    statMsg:
                                      type: string
                                      example: "Successfully Received"
                                spayloadReplacer:
                                  type: object
                                  properties:
                                    refRefNo:
                                      type: string
                                      example: body.refRefNo
                                    statCode:
                                      type: string
                                      example: body.stscode
                                    statMsg:
                                      type: string
                                      example: "body.msg"
                                dpayload:
                                  type: object
                                  properties:
                                    request_id:
                                      type: string
                                      example: ""
                                    money:
                                      type: integer
                                dpayloadReplace:
                                  type: object
                                  properties:
                                    request_id:
                                      type: string
                                      example: body.request_id
                                    money:
                                      type: string
                                      example: body.amt
                                pub:
                                  type: object
                                  properties:
                                    url:
                                      type: string
                                      example:  "/sb/cwd/{device_id}/out/transaction"
                                    replace:
                                      type: string
                                      example: '{device_id}'
                                sub:
                                  type: object
                                  properties:
                                    url:
                                      type: string
                                      example:  "/sb/cwd/{device_id}/in/transaction"
                                    replace:
                                      type: string
                                      example: '{device_id}'
