name: Deploy to ECR aws git   

on:
  push:
    branches: [ mqtt-test ]
  workflow_dispatch:
    inputs:
      ec2_instance_id:
        description: 'EC2 Instance IP'
        required: true
        default: ''

env:
  ECR_REPOSITORY: dms-ecr
  AWS_REGION: ap-south-1

jobs:
  build:
    name: Deployment
    runs-on: ubuntu-latest

    steps:
    - name: Set up Git repository
      uses: actions/checkout@v2
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    # - name: Run ESLint
    #   run: npm run lint

    - name: Prepare environment variables
      shell: bash
      env:
        PG_HOST: ${{ secrets.PG_DB_HOST }}
        PG_DB: ${{ secrets.PG_DB_NAME }}
        PG_PASSWORD: ${{ secrets.PG_DB_PASSWORD }}
        PG_USER: ${{ secrets.PG_DB_USERNAME }}
        PG_PORT: ${{ secrets.PG_DB_PORT }}
        PG_DB_CERT: ${{ secrets.PG_DB_CERT }}
        HTTPS_CRT: ${{ secrets.HTTPS_CRT }}
        HTTPS_KEY: ${{ secrets.HTTPS_KEY }}
        AXIOS_URL: ${{secrets.AXIOS_URL}}
      run: |
          for var in PG_HOST PG_DB PG_PASSWORD PG_USER PG_PORT PG_DB_CERT HTTPS_CRT HTTPS_KEY AXIOS_URL; do
            eval "value=\${${var}}"
            printf -v escaped_value '%q' "$value"
            echo "${var}=$escaped_value" >> $GITHUB_ENV
          done

    - name: Replace Environment Variables in `.env`
      run: |
            sed -i "s#pg_db_host#${{ env.PG_HOST }}#g" .env
            sed -i "s#pg_db_name#${{ env.PG_DB }}#g" .env
            sed -i "s#pg_db_pswd#${{ env.PG_PASSWORD }}#g" .env
            sed -i "s#pg_db_user#${{ env.PG_USER }}#g" .env
            sed -i "s#pg_db_port#${{ env.PG_PORT }}#g" .env
            sed -i "s#pg_db_cert#${{ env.PG_DB_CERT }}#g" .env
            sed -i "s#https_crt#${{ env.HTTPS_CRT }}#g" .env
            sed -i "s#https_key#${{ env.HTTPS_KEY }}#g" .env
            sed -i "s#axios_url#${{env.AXIOS_URL}}#g" .env
    
    # - name: Execute Flyway Migration
    #   run: |
    #       docker run --rm \
    #         -e FLYWAY_URL=jdbc:postgresql://${{ secrets.PG_DB_HOST }}:${{ secrets.PG_DB_PORT }}/${{ secrets.PG_DB_NAME }} \
    #         -e FLYWAY_USER=${{ secrets.PG_DB_USERNAME }} \
    #         -e FLYWAY_PASSWORD=${{ secrets.PG_DB_PASSWORD }} \
    #         -e FLYWAY_SCHEMAS=switch \
    #         -v $(pwd)/db:/flyway/sql \
    #         flyway/flyway:latest migrate

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Set Docker Image Details
      run: |
        echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
        echo "IMAGE_TAG=drouter-https-${{ github.run_number }}" >> $GITHUB_ENV

    - name: Debug Docker Image Reference
      run: |
        echo "ECR_REGISTRY=${{ env.ECR_REGISTRY }}"
        echo "ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}"
        echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

