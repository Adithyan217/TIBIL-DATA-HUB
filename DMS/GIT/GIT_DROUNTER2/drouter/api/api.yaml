openapi: 3.0.0
info:
  title: Bank API
  version: 1.0.0
paths:
  /switch/pnotif:
    post: 
      summary: Post Banks
      description: Post Bank
      parameters:
        - name: context
          in: header
          required: false
          schema:
            type: string
            example: Janna Bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                SV: ""
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 2000
                  message:
                    type: string
                    example: Payment record created successfully
        400:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  message:
                    type: string
                    example: Failed to post the bank data
      
  /switch/ping:
    get:
      summary: Get Banks
      description: Get the list of banks
      operationId: listBanks
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: string
                example: ok
        400:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  message:
                    type: string
                    example: "No record found"