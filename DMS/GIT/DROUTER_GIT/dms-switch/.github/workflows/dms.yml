name: Deploy to ECR aws git   

on:
  push:
    branches: [ switch-cwd ]
  workflow_dispatch:
    inputs:
      ec2_instance_id:
        description: 'EC2 Instance IP'
        required: true
        default: ''

env:
  ECR_REPOSITORY: dms-ecr
  AWS_REGION: ap-south-1

jobs:
  build:
    name: Deployment
    runs-on: ubuntu-latest

    steps:
    - name: Set up Git repository
      uses: actions/checkout@v2
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    # - name: Run ESLint
    #   run: npm run lint

    - name: Prepare environment variables
      shell: bash
      env:
        PG_HOST: ${{ secrets.PG_DB_HOST }}
        PG_DB: ${{ secrets.PG_DB_NAME }}
        PG_PASSWORD: ${{ secrets.PG_DB_PASSWORD }}
        PG_USER: ${{ secrets.PG_DB_USERNAME }}
        PG_PORT: ${{ secrets.PG_DB_PORT }}
        PG_DB_CERT: ${{ secrets.PG_DB_CERT }}
        MQTT_CLIENT: ${{ secrets.MQTT_CLIENT }}
        MQTT_HOST: ${{ secrets.MQTT_HOST }}
        MQTT_PORT: ${{ secrets.MQTT_PORT }}
      run: |
        echo "PG_HOST: $PG_HOST"
        echo "PG_DB: $PG_DB"
        echo "PG_PASSWORD: $PG_PASSWORD"
        echo "PG_USER: $PG_USER"
        echo "PG_PORT: $PG_PORT"
        echo "PG_DB_CERT: $PG_DB_CERT"
        echo "MQTT_CLIENT: $MQTT_CLIENT"
        echo "MQTT_HOST: $MQTT_HOST"
        echo "MQTT_PORT: $MQTT_PORT"

    - name: Escape environment variables
      shell: bash
      env:
        PG_HOST: ${{ secrets.PG_DB_HOST }}
        PG_DB: ${{ secrets.PG_DB_NAME }}
        PG_PASSWORD: ${{ secrets.PG_DB_PASSWORD }}
        PG_USER: ${{ secrets.PG_DB_USERNAME }}
        PG_PORT: ${{ secrets.PG_DB_PORT }}
        PG_DB_CERT: ${{ secrets.PG_DB_CERT }}
        MQTT_CLIENT: ${{ secrets.MQTT_CLIENT }}
        MQTT_HOST: ${{ secrets.MQTT_HOST }}
        MQTT_PORT: ${{ secrets.MQTT_PORT }}
      run: |
        printf -v ESCAPED_PG_HOST '%q' "$PG_HOST"
        printf -v ESCAPED_PG_DB '%q' "$PG_DB"
        printf -v ESCAPED_PG_PASSWORD '%q' "$PG_PASSWORD"
        printf -v ESCAPED_PG_USER '%q' "$PG_USER"
        printf -v ESCAPED_PG_PORT '%q' "$PG_PORT"
        printf -v ESCAPED_PG_DB_CERT '%q' "$PG_DB_CERT"
        printf -v ESCAPED_MQTT_CLIENT '%q' "$MQTT_CLIENT "
        printf -v ESCAPED_MQTT_HOST '%q' "$MQTT_HOST"
        printf -v ESCAPED_MQTT_PORT '%q' "$MQTT_PORT"
        echo "ESCAPED_PG_HOST: $ESCAPED_PG_HOST"
        echo "ESCAPED_PG_DB: $ESCAPED_PG_DB"
        echo "ESCAPED_PG_PASSWORD: $ESCAPED_PG_PASSWORD"
        echo "ESCAPED_PG_USER: $ESCAPED_PG_USER"
        echo "ESCAPED_PG_PORT: $ESCAPED_PG_PORT"
        echo "ESCAPED_PG_DB_CERT: $ESCAPED_PG_DB_CERT"
        echo "ESCAPED_MQTT_CLIENT: $ESCAPED_MQTT_CLIENT"
        echo "ESCAPED_MQTT_HOST: $ESCAPED_MQTT_HOST"
        echo "ESCAPED_MQTT_PORT: $ESCAPED_MQTT_PORT"
        echo "ESCAPED_PG_HOST=$ESCAPED_PG_HOST" >> $GITHUB_ENV
        echo "ESCAPED_PG_DB=$ESCAPED_PG_DB" >> $GITHUB_ENV
        echo "ESCAPED_PG_PASSWORD=$ESCAPED_PG_PASSWORD" >> $GITHUB_ENV
        echo "ESCAPED_PG_USER=$ESCAPED_PG_USER" >> $GITHUB_ENV
        echo "ESCAPED_PG_PORT=$ESCAPED_PG_PORT" >> $GITHUB_ENV
        echo "ESCAPED_PG_DB_CERT=$ESCAPED_PG_DB_CERT" >> $GITHUB_ENV
        echo "ESCAPED_MQTT_CLIENT=$ESCAPED_MQTT_CLIENT" >> $GITHUB_ENV
        echo "ESCAPED_MQTT_HOST=$ESCAPED_MQTT_HOST" >> $GITHUB_ENV
        echo "ESCAPED_MQTT_PORT=$ESCAPED_MQTT_PORT" >> $GITHUB_ENV

    - name: Replace environment variables
      shell: bash
      env:
        ESCAPED_PG_HOST: ${{ env.ESCAPED_PG_HOST }}
        ESCAPED_PG_DB: ${{ env.ESCAPED_PG_DB }}
        ESCAPED_PG_PASSWORD: ${{ env.ESCAPED_PG_PASSWORD }}
        ESCAPED_PG_USER: ${{ env.ESCAPED_PG_USER }}
        ESCAPED_PG_PORT: ${{ env.ESCAPED_PG_PORT }}
        ESCAPED_PG_DB_CERT: ${{ env.ESCAPED_PG_DB_CERT }}
        ESCAPED_MQTT_CLIENT: ${{ env.ESCAPED_MQTT_CLIENT }}
        ESCAPED_MQTT_HOST: ${{ env.ESCAPED_MQTT_HOST }}
        ESCAPED_MQTT_PORT: ${{ env.ESCAPED_MQTT_PORT }}
      run: |
        sed -i "s#pg_db_host#${ESCAPED_PG_HOST}#g" .env
        sed -i "s#pg_db_name#${ESCAPED_PG_DB}#g" .env
        sed -i "s#pg_db_pswd#${ESCAPED_PG_PASSWORD}#g" .env
        sed -i "s#pg_db_user#${ESCAPED_PG_USER}#g" .env
        sed -i "s#pg_db_port#${ESCAPED_PG_PORT}#g" .env
        sed -i "s#pg_db_cert#${ESCAPED_PG_DB_CERT}#g" .env
        sed -i "s#mqtt_client#${ESCAPED_MQTT_CLIENT}#g" .env
        sed -i "s#mqtt_host#${ESCAPED_MQTT_HOST}#g" .env
        sed -i "s#mqtt_port#${ESCAPED_MQTT_PORT}#g" .env
    
    # - name: Execute Flyway Migration
    #   run: |
    #       docker run --rm \
    #         -e FLYWAY_URL=jdbc:postgresql://${{ secrets.PG_DB_HOST }}:${{ secrets.PG_DB_PORT }}/${{ secrets.PG_DB_NAME }} \
    #         -e FLYWAY_USER=${{ secrets.PG_DB_USERNAME }} \
    #         -e FLYWAY_PASSWORD=${{ secrets.PG_DB_PASSWORD }} \
    #         -e FLYWAY_SCHEMAS=switch \
    #         -v $(pwd)/db:/flyway/sql \
    #         flyway/flyway:latest migrate

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Set Docker Image Details
      run: |
        echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
        echo "IMAGE_TAG=dms-cwd${{ github.run_number }}" >> $GITHUB_ENV

    - name: Debug Docker Image Reference
      run: |
        echo "ECR_REGISTRY=${{ env.ECR_REGISTRY }}"
        echo "ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}"
        echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

