name: Deploy to ECR AWS  

on:
  push:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      ec2_instance_id:
        description: 'EC2 Instance IP'
        required: true
        default: ''

env:
  ECR_REPOSITORY: dms-ecr
  AWS_REGION: ap-south-1

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set Execute Permission for Script
        run: chmod +x scripts/update-version.sh

      - name: Run Version Update Script
        run: scripts/update-version.sh

      - name: Set Timezone to IST
        run: echo "TZ=Asia/Kolkata" >> $GITHUB_ENV

      - name: Print Current Time in IST
        run: date "+%Y-%m-%d %H:%M:%S"

      - name: Update release date and timestamp in .env and .version files
        run: |
          # Update in .env
          sed -i "s/^RELEASE_DATE=.*/RELEASE_DATE=$(date +'%d\/%m\/%Y')/" .env
          sed -i "s/^TIMESTAMP=.*/TIMESTAMP=$(date +'%H:%M:%S')/" .env

          # Update in .version
          sed -i -E "s|(release-date:\s*)[0-9]{2}/[0-9]{2}/[0-9]{4}|\1$(date +'%d/%m/%Y')|" .version
          sed -i -E "s|(time-stamp:\s*)[0-9]{2}:[0-9]{2}:[0-9]{2}|\1$(date +'%H:%M:%S')|" .version

          # Print updated files for verification
          echo "Updated .env:"
          cat .env
          echo "Updated .version:"
          cat .version

      - name: Check for Changes
        run: |
          git diff --quiet || echo "CHANGES=true" >> $GITHUB_ENV

      - name: Commit and Push Changes
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          git config --global user.name "patmdms"
          git config --global user.email "prod.dms@pocketatm.in"
          git add .env .version
          git commit -m "Auto-increment minor version and update timestamp [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.ACCESS_TOKEN }}@github.com/${{ github.repository }}.git dev

  build_and_deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: update-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set Docker Image Details
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=registry-dev-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Debug Docker Image Reference
        run: |
          echo "ECR_REGISTRY=${{ env.ECR_REGISTRY }}"
          echo "ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}"
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
