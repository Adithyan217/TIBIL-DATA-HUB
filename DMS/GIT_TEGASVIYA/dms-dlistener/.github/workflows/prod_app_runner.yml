name: Deploy to App Runner AWS

on:
  push:
    branches: [ prod-apprunner ]
  workflow_dispatch:
    inputs:
      # Optional input for future flexibility
      ec2_instance_id:
        description: 'EC2 Instance IP (optional)'
        required: false
        default: ''

env:
  ECR_REPOSITORY: prod-apprunner-dms
  AWS_REGION: ap-south-1

jobs:
  deploy:
    name: Deploy to App Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker Image Details
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=dlistener-apprunner-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Debug Docker Image Reference
        run: |
          echo "ECR_REGISTRY=${{ env.ECR_REGISTRY }}"
          echo "ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}"
          echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"

      - name: Build, tag, and push image to Amazon ECR
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
      - name: Update App Runner Service with new image
        run: |
          aws apprunner update-service \
            --service-arn ${{ secrets.DLISTENER_APP_RUNNER_SERVICE_ARN }} \
            --source-configuration "ImageRepository={ImageIdentifier=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG,ImageRepositoryType=ECR},AuthenticationConfiguration={AccessRoleArn=arn:aws:iam::793882144821:role/service-role/PROD-App-Runner-ECR-Access-Role}"
