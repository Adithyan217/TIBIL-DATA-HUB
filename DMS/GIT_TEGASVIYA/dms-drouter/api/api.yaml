openapi: 3.0.0
info:
  title: Bank API
  version: 1.0.0
paths:
  /drouter/pnotif:
    post:
      summary: Post Banks
      description: Post Bank
      parameters:
        - name: context
          in: header
          required: false
          schema:
            type: string
            example: Janna Bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              example:
                SV: ""
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 2000
                  message:
                    type: string
                    example: Payment record created successfully
        400:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  message:
                    type: string
                    example: Failed to post the bank data
  /drouter/device/deactivation:
    post:
      summary: device deactivation
      description: device deactivation


      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: "string"
                  example: "ENABLE_SOUNDBOX"
                event_by:
                  type: "string"
                  example: "user123"
                edetails:
                  type: array
                  items:
                    type: object
                    properties:
                      row_id:
                        type: "string"
                        example: "1"
                      rcontext:
                        type: "string"
                        example: "cwd"
                      dname:
                        type: "string"
                        example: "device A"
                      imei:
                        type: "string"
                        example: "ahbfdjk125154"

      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 2000
                  message:
                    type: string
                    example: successfully added
                  edata:
                    type: object
                    properties:
                      headers:
                        type: array
                        items:
                          type: string
                        example:
                          - "row_id"
                          - status
                          - msgs
                      values:
                        type: array
                        items:
                          type: array
                          items:
                            type: string
                          example:
                            - 1
                            - 1
                            - "success"
                      status:
                        type: array
                        items:
                          type: integer
                        example:
                          - 1
                          - 1
                          - 0


        400:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  message:
                    type: string
                    example: Failed to post the bank data

  /drouter/sb:
    post:
      summary: insert into sb table
      description: soundbox


      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: "string"
                  example: "ENABLE_SOUNDBOX"
                event_by:
                  type: "string"
                  example: "user123"
                edetails:
                  type: array
                  items:
                    type: object
                    properties:
                      row_id:
                        type: "string"
                        example: "1"
                      device_id:
                        type: "string"
                        example: "device_4"


      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 2000
                  message:
                    type: string
                    example: successfully added
                  edata:
                    type: object
                    properties:
                      headers:
                        type: array
                        items:
                          type: string
                        example:
                          - "row_id"
                          - status
                          - msgs
                      values:
                        type: array
                        items:
                          type: array
                          items:
                            type: string
                          example:
                            - 1
                            - 1
                            - "success"
                      status:
                        type: array
                        items:
                          type: integer
                        example:
                          - 1
                          - 1
                          - 0


        400:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  message:
                    type: string
                    example: Failed to post the bank data

  /switch/ping:
    get:
      summary: Get Banks
      description: Get the list of banks
      operationId: listBanks
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: string
                example: ok
        400:
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1000
                  message:
                    type: string
                    example: "No record found"