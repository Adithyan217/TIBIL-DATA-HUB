apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-ms-deployment
  namespace: dms-uat
  labels:
    app: intel-ms
    environment: uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intel-ms
      environment: uat
  template:
    metadata:
      labels:
        app: intel-ms
        environment: uat
    spec:
      serviceAccountName: uat-secrets-sa
      volumes:
        - name: intel-ms-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: intel-ms-secrets
      containers:
        - name: intel-ms
          image: DOCKER_IMAGE_PLACEHOLDER
          volumeMounts:
            - name: intel-ms-secrets
              mountPath: /app/src/secrets
          ports:
          - containerPort: 3008
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "786m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: intel-service
  namespace: dms-uat
spec:
  selector:
    app: intel-ms
    environment: uat
  ports:
    - protocol: TCP
      port: 8441
      targetPort: 3008
  type: NodePort