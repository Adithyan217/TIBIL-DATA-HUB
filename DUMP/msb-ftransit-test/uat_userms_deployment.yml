apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  namespace: dms-uat
  labels:
    app: user-ms
    environment: uat  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-ms
      environment: uat
  template:
    metadata:
      labels:
        app: user-ms
        environment: uat  
    spec:
      serviceAccountName: uat-secrets-sa
      volumes:
        - name: user-ms-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: user-ms-secrets
      containers:
      - name: user-ms
        image: DOCKER_IMAGE_PLACEHOLDER
        volumeMounts:
            - name: user-ms-secrets
              mountPath: /app/src/secrets
        ports:
        - containerPort: 3001
        resources:
          requests:
            cpu: "100m"
            memory: "200Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"  
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: dms-uat
spec:
  selector:
    app: user-ms
    environment: uat  
  ports:
    - protocol: TCP
      port: 8441
      targetPort: 3001
  type: NodePort
